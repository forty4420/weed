<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strain Tracker</title>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #121212;
  --surface: #1e1e1e;
  --card: #252525;
  --border: #333;
  --text: #e0e0e0;
  --text2: #999;
  --green: #4caf50;
  --green-dark: #388e3c;
  --red: #f44336;
  --orange: #ff9800;
  --blue: #2196f3;
  --purple: #9c27b0;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
a { color:var(--green); text-decoration:none; }
button { cursor:pointer; border:none; font-family:inherit; font-size:14px; }
input,textarea,select { font-family:inherit; font-size:14px; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px 12px; width:100%; outline:none; }
input:focus,textarea:focus,select:focus { border-color:var(--green); }
textarea { resize:vertical; min-height:80px; }

/* Layout */
.container { max-width:1000px; margin:0 auto; padding:16px; }
.header { display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--border); margin-bottom:20px; flex-wrap:wrap; gap:10px; }
.header h1 { font-size:22px; color:var(--green); }
.header-actions { display:flex; gap:8px; align-items:center; }

/* Buttons */
.btn { padding:8px 16px; border-radius:8px; font-weight:500; transition:all .2s; display:inline-flex; align-items:center; gap:6px; }
.btn-green { background:var(--green); color:#fff; }
.btn-green:hover { background:var(--green-dark); }
.btn-red { background:var(--red); color:#fff; }
.btn-red:hover { background:#c62828; }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
.btn-outline:hover { border-color:var(--green); color:var(--green); }
.btn-sm { padding:5px 10px; font-size:12px; }
.btn-icon { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; padding:0; }

/* Cards */
.card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; }
.strain-card { display:flex; gap:14px; position:relative; transition:transform .15s; }
.strain-card:hover { transform:translateY(-1px); }
.strain-thumb { width:80px; height:80px; border-radius:8px; object-fit:cover; background:var(--surface); flex-shrink:0; }
.strain-thumb-placeholder { width:80px; height:80px; border-radius:8px; background:var(--surface); flex-shrink:0; display:flex; align-items:center; justify-content:center; color:var(--text2); font-size:28px; }
.strain-info { flex:1; min-width:0; }
.strain-name { font-size:16px; font-weight:600; margin-bottom:4px; }
.strain-meta { font-size:12px; color:var(--text2); display:flex; flex-wrap:wrap; gap:8px; margin-bottom:4px; }
.strain-meta span { display:inline-flex; align-items:center; gap:3px; }
.strain-type { font-size:11px; padding:2px 8px; border-radius:10px; font-weight:500; text-transform:uppercase; }
.type-indica { background:#7b1fa2; color:#fff; }
.type-sativa { background:#f57c00; color:#fff; }
.type-hybrid { background:#388e3c; color:#fff; }
.strain-rating { color:var(--orange); font-size:14px; }
.strain-actions { position:absolute; top:8px; right:8px; display:flex; gap:4px; }
.strain-delete { background:rgba(244,67,54,.15); color:var(--red); width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; border:none; cursor:pointer; }
.strain-delete:hover { background:var(--red); color:#fff; }

/* Stats */
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:20px; }
.stat-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; text-align:center; }
.stat-value { font-size:24px; font-weight:700; color:var(--green); }
.stat-label { font-size:12px; color:var(--text2); margin-top:2px; }

/* Search */
.search-bar { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.search-bar input { flex:1; min-width:180px; }
.filter-chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.chip { padding:5px 12px; border-radius:16px; font-size:12px; border:1px solid var(--border); background:transparent; color:var(--text2); cursor:pointer; transition:all .2s; }
.chip.active { background:var(--green); border-color:var(--green); color:#fff; }

/* Modal */
.modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.7); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding:20px; overflow-y:auto; }
.modal { background:var(--surface); border:1px solid var(--border); border-radius:16px; width:100%; max-width:600px; margin:40px 0; }
.modal-header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); }
.modal-header h2 { font-size:18px; }
.modal-body { padding:20px; }
.modal-footer { padding:12px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; }

/* Form */
.form-group { margin-bottom:14px; }
.form-group label { display:block; font-size:13px; color:var(--text2); margin-bottom:5px; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.form-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }

/* Photo gallery */
.photo-gallery { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.photo-gallery img { width:70px; height:70px; object-fit:cover; border-radius:6px; cursor:pointer; border:2px solid transparent; transition:border .2s; }
.photo-gallery img:hover { border-color:var(--green); }
.photo-upload-area { border:2px dashed var(--border); border-radius:8px; padding:20px; text-align:center; color:var(--text2); cursor:pointer; transition:border-color .2s; }
.photo-upload-area:hover { border-color:var(--green); }
.photo-upload-area input { display:none; }

/* Lightbox */
.lightbox { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.9); z-index:200; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.lightbox img { max-width:90%; max-height:90vh; border-radius:8px; }

/* Terpenes */
.terpene-tags { display:flex; flex-wrap:wrap; gap:4px; }
.terpene-tag { font-size:11px; padding:2px 8px; background:rgba(76,175,80,.15); color:var(--green); border-radius:10px; }

/* Tabs */
.tabs { display:flex; gap:0; border-bottom:1px solid var(--border); margin-bottom:16px; }
.tab { padding:10px 18px; font-size:14px; color:var(--text2); cursor:pointer; border-bottom:2px solid transparent; background:none; transition:all .2s; }
.tab.active { color:var(--green); border-bottom-color:var(--green); }

/* Auth page */
.auth-container { max-width:400px; margin:80px auto; padding:16px; }
.auth-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:30px; }
.auth-title { text-align:center; font-size:28px; color:var(--green); margin-bottom:6px; }
.auth-subtitle { text-align:center; color:var(--text2); margin-bottom:24px; font-size:14px; }

/* Public stats */
.public-stats { text-align:center; margin-top:20px; color:var(--text2); font-size:13px; }

/* Loading */
.spinner { width:20px; height:20px; border:2px solid var(--border); border-top-color:var(--green); border-radius:50%; animation:spin .6s linear infinite; display:inline-block; }
@keyframes spin { to { transform:rotate(360deg); } }
.loading-overlay { position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; border-radius:12px; z-index:10; }

/* Toast */
.toast { position:fixed; bottom:20px; right:20px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 18px; z-index:300; font-size:14px; animation:slideUp .3s; max-width:350px; }
.toast.success { border-color:var(--green); }
.toast.error { border-color:var(--red); }
@keyframes slideUp { from { transform:translateY(20px); opacity:0; } to { transform:translateY(0); opacity:1; } }

/* Effects list */
.effects-list { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
.effect-tag { font-size:11px; padding:2px 8px; background:rgba(33,150,243,.15); color:var(--blue); border-radius:10px; }

/* Review text */
.review-text { font-size:13px; color:var(--text2); margin-top:6px; font-style:italic; }

/* Star rating */
.star-input { display:flex; gap:4px; }
.star-input span { font-size:24px; cursor:pointer; color:var(--border); transition:color .15s; }
.star-input span.filled { color:var(--orange); }

/* Responsive */
@media (max-width:600px) {
  .form-row, .form-row-3 { grid-template-columns:1fr; }
  .strain-card { flex-direction:column; }
  .strain-thumb, .strain-thumb-placeholder { width:100%; height:160px; }
  .stats-grid { grid-template-columns:repeat(2,1fr); }
  .header { flex-direction:column; align-items:stretch; }
  .header-actions { justify-content:flex-end; }
}

/* Admin Dashboard */
.admin-container { max-width:1200px; margin:0 auto; padding:16px; }
.admin-header { display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--border); margin-bottom:20px; flex-wrap:wrap; gap:10px; }
.admin-header h1 { font-size:22px; color:var(--red); }
.admin-tabs { display:flex; gap:0; border-bottom:1px solid var(--border); margin-bottom:20px; }
.admin-tab { padding:12px 20px; font-size:14px; color:var(--text2); cursor:pointer; border-bottom:2px solid transparent; background:none; transition:all .2s; }
.admin-tab.active { color:var(--red); border-bottom-color:var(--red); }

.user-table { width:100%; border-collapse:collapse; }
.user-table th { text-align:left; padding:10px 12px; font-size:12px; color:var(--text2); text-transform:uppercase; border-bottom:1px solid var(--border); }
.user-table td { padding:10px 12px; font-size:13px; border-bottom:1px solid var(--border); }
.user-table tr:hover td { background:var(--card); }
.user-table .user-actions { display:flex; gap:6px; }

.admin-stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:24px; }
.admin-stat-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; text-align:center; }
.admin-stat-value { font-size:28px; font-weight:700; color:var(--green); }
.admin-stat-label { font-size:12px; color:var(--text2); margin-top:4px; }

.chart-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(400px,1fr)); gap:16px; margin-bottom:24px; }
.chart-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
.chart-card h3 { font-size:14px; margin-bottom:12px; color:var(--text); }
.chart-card canvas { max-height:300px; }

.user-detail-header { display:flex; align-items:center; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
.user-avatar { width:64px; height:64px; border-radius:50%; background:var(--card); border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; color:var(--green); }
.user-detail-info h2 { font-size:20px; }
.user-detail-info p { font-size:13px; color:var(--text2); }

.back-btn { background:none; border:none; color:var(--text2); font-size:13px; cursor:pointer; padding:4px 0; margin-bottom:12px; display:inline-flex; align-items:center; gap:4px; }
.back-btn:hover { color:var(--green); }

.strain-mini-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; }
.strain-mini-name { font-size:13px; font-weight:500; }
.strain-mini-meta { font-size:11px; color:var(--text2); display:flex; gap:8px; margin-top:2px; }

@media (max-width:600px) {
  .chart-grid { grid-template-columns:1fr; }
  .admin-stats-grid { grid-template-columns:repeat(2,1fr); }
  .user-table { font-size:11px; }
  .user-table th, .user-table td { padding:6px 8px; }
}

.hidden { display:none !important; }
</style>
</head>
<body>

<!-- ============ AUTH VIEW ============ -->
<div id="authView">
  <div class="auth-container">
    <div class="auth-card">
      <h1 class="auth-title">Strain Tracker</h1>
      <p class="auth-subtitle">Track your cannabis collection</p>

      <div id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="loginUser" autocomplete="username" placeholder="Enter username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPass" autocomplete="current-password" placeholder="Enter password">
        </div>
        <button class="btn btn-green" style="width:100%;justify-content:center;margin-top:8px" onclick="doLogin()">Log In</button>
        <p style="text-align:center;margin-top:14px;font-size:13px;color:var(--text2)">
          Don't have an account? <a href="#" onclick="showRegister()">Register</a>
        </p>
      </div>

      <div id="registerForm" class="hidden">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="regUser" autocomplete="username" placeholder="Choose a username">
        </div>
        <div class="form-group">
          <label>Display Name</label>
          <input type="text" id="regName" placeholder="Your display name">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPass" autocomplete="new-password" placeholder="Choose a password (6+ chars)">
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="regPass2" autocomplete="new-password" placeholder="Confirm password">
        </div>
        <button class="btn btn-green" style="width:100%;justify-content:center;margin-top:8px" onclick="doRegister()">Create Account</button>
        <p style="text-align:center;margin-top:14px;font-size:13px;color:var(--text2)">
          Already have an account? <a href="#" onclick="showLogin()">Log In</a>
        </p>
      </div>
    </div>

    <div class="public-stats" id="publicStats"></div>
  </div>
</div>

<!-- ============ MAIN APP ============ -->
<div id="appView" class="hidden">
  <div class="container">
    <div class="header">
      <h1>Strain Tracker</h1>
      <div class="header-actions">
        <span id="userGreeting" style="font-size:13px;color:var(--text2)"></span>
        <button class="btn btn-sm" id="adminBtn" style="background:var(--red);color:#fff;display:none" onclick="showAdminPanel()">Admin</button>
        <button class="btn btn-outline btn-sm" onclick="showProfile()">Profile</button>
        <button class="btn btn-outline btn-sm" onclick="doLogout()">Logout</button>
      </div>
    </div>

    <!-- Stats Dashboard -->
    <div class="stats-grid" id="statsGrid"></div>

    <!-- Action bar -->
    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
      <button class="btn btn-green" onclick="openAddStrain()">+ Add Strain</button>
      <button class="btn btn-outline" onclick="openImportReceipt()">Import Receipt</button>
      <button class="btn btn-outline" onclick="exportData()">Export</button>
    </div>

    <!-- Search & Filter -->
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search strains..." oninput="renderStrains()">
    </div>
    <div class="filter-chips">
      <button class="chip active" data-filter="all" onclick="setFilter('all',this)">All</button>
      <button class="chip" data-filter="indica" onclick="setFilter('indica',this)">Indica</button>
      <button class="chip" data-filter="sativa" onclick="setFilter('sativa',this)">Sativa</button>
      <button class="chip" data-filter="hybrid" onclick="setFilter('hybrid',this)">Hybrid</button>
    </div>

    <!-- Sort -->
    <div style="display:flex;gap:8px;margin-bottom:14px;align-items:center">
      <span style="font-size:12px;color:var(--text2)">Sort:</span>
      <select id="sortSelect" onchange="renderStrains()" style="width:auto;padding:5px 10px;font-size:12px">
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
        <option value="name">Name A-Z</option>
        <option value="rating">Highest Rated</option>
        <option value="thc">Highest THC</option>
        <option value="price-low">Price: Low-High</option>
        <option value="price-high">Price: High-Low</option>
      </select>
    </div>

    <!-- Strain List -->
    <div id="strainList"></div>
  </div>
</div>

<!-- ============ ADMIN VIEW ============ -->
<div id="adminView" class="hidden">
  <div class="admin-container">
    <div class="admin-header">
      <h1>Admin Dashboard</h1>
      <div class="header-actions">
        <button class="btn btn-green btn-sm" onclick="downloadAdminCSV()">Download CSV</button>
        <button class="btn btn-outline btn-sm" onclick="hideAdminPanel()">Back to App</button>
        <button class="btn btn-outline btn-sm" onclick="doLogout()">Logout</button>
      </div>
    </div>

    <div class="admin-tabs">
      <button class="admin-tab active" onclick="switchAdminTab('overview',this)">Overview</button>
      <button class="admin-tab" onclick="switchAdminTab('users',this)">Users</button>
      <button class="admin-tab" onclick="switchAdminTab('userDetail',this)" id="userDetailTab" style="display:none">User Detail</button>
    </div>

    <!-- Overview Tab -->
    <div id="adminOverviewTab">
      <div class="admin-stats-grid" id="adminStatsGrid"></div>
      <div class="chart-grid" id="adminCharts"></div>
    </div>

    <!-- Users Tab -->
    <div id="adminUsersTab" class="hidden">
      <div style="margin-bottom:16px;display:flex;gap:8px;align-items:center">
        <input type="text" id="adminUserSearch" placeholder="Search users..." oninput="filterAdminUsers()" style="max-width:300px">
        <span id="adminUserCount" style="font-size:12px;color:var(--text2)"></span>
      </div>
      <div style="overflow-x:auto">
        <table class="user-table">
          <thead>
            <tr>
              <th>User</th>
              <th>Strains</th>
              <th>Spent</th>
              <th>Dispensaries</th>
              <th>Visits</th>
              <th>Joined</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="adminUserList"></tbody>
        </table>
      </div>
    </div>

    <!-- User Detail Tab -->
    <div id="adminUserDetailTab" class="hidden">
      <button class="back-btn" onclick="switchAdminTab('users',document.querySelector('.admin-tab:nth-child(2)'))">&#8592; Back to Users</button>
      <div id="adminUserDetail"></div>
    </div>
  </div>
</div>

<!-- ============ MODALS ============ -->
<div id="modalContainer"></div>
<div id="lightbox" class="lightbox hidden" onclick="closeLightbox()">
  <img id="lightboxImg" src="">
</div>
<div id="toastContainer"></div>

<script>
// ============ CONFIG ============
const API_URL = 'api.php';  // Change if hosted elsewhere

// ============ STATE ============
let state = {
  token: localStorage.getItem('st_token') || '',
  user: JSON.parse(localStorage.getItem('st_user') || 'null'),
  strains: [],
  filter: 'all',
};

// ============ API ============
async function api(action, opts = {}) {
  const { method = 'GET', body, formData } = opts;
  const headers = {};
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  if (body && !formData) headers['Content-Type'] = 'application/json';

  const fetchOpts = { method, headers };
  if (formData) fetchOpts.body = formData;
  else if (body) fetchOpts.body = JSON.stringify(body);

  const sep = action.includes('?') ? '&' : '?';
  const url = `${API_URL}?action=${action}`;
  const res = await fetch(url, fetchOpts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'API error');
  return data;
}

// ============ AUTH ============
function showLogin() {
  document.getElementById('loginForm').classList.remove('hidden');
  document.getElementById('registerForm').classList.add('hidden');
}
function showRegister() {
  document.getElementById('loginForm').classList.add('hidden');
  document.getElementById('registerForm').classList.remove('hidden');
}

async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  if (!username || !password) return toast('Fill in all fields', 'error');
  try {
    const data = await api('login', { method: 'POST', body: { username, password } });
    setAuth(data.token, data.user);
    toast('Logged in');
  } catch (e) { toast(e.message, 'error'); }
}

async function doRegister() {
  const username = document.getElementById('regUser').value.trim();
  const displayName = document.getElementById('regName').value.trim();
  const password = document.getElementById('regPass').value;
  const password2 = document.getElementById('regPass2').value;
  if (!username || !password) return toast('Fill in all fields', 'error');
  if (password !== password2) return toast('Passwords do not match', 'error');
  if (password.length < 6) return toast('Password must be 6+ characters', 'error');
  try {
    const data = await api('register', { method: 'POST', body: { username, password, displayName } });
    setAuth(data.token, data.user);
    toast('Account created');
  } catch (e) { toast(e.message, 'error'); }
}

function setAuth(token, user) {
  state.token = token;
  state.user = user;
  localStorage.setItem('st_token', token);
  localStorage.setItem('st_user', JSON.stringify(user));
  showApp();
}

function doLogout() {
  api('logout', { method: 'POST' }).catch(() => {});
  state.token = '';
  state.user = null;
  state.strains = [];
  localStorage.removeItem('st_token');
  localStorage.removeItem('st_user');
  showAuth();
}

// ============ VIEWS ============
function showAuth() {
  document.getElementById('authView').classList.remove('hidden');
  document.getElementById('appView').classList.add('hidden');
  document.getElementById('adminView').classList.add('hidden');
  loadPublicStats();
}

async function showApp() {
  document.getElementById('authView').classList.add('hidden');
  document.getElementById('adminView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  document.getElementById('userGreeting').textContent = 'Hi, ' + (state.user?.displayName || state.user?.username || '');
  // Refresh user info from server (admin status, display name)
  try {
    const profile = await api('profile');
    console.log('[StrainTracker] Profile refresh:', { id: profile.id, isAdmin: profile.isAdmin, displayName: profile.displayName });
    state.user.isAdmin = !!profile.isAdmin;
    state.user.displayName = profile.displayName || state.user.displayName;
    state.user.id = profile.id || state.user.id;
    localStorage.setItem('st_user', JSON.stringify(state.user));
  } catch (e) {
    console.error('[StrainTracker] Profile refresh failed:', e.message);
    if (e.message.includes('expired') || e.message.includes('Invalid token') || e.message.includes('Authentication')) {
      doLogout();
      return;
    }
  }
  document.getElementById('adminBtn').style.display = state.user?.isAdmin ? '' : 'none';
  document.getElementById('userGreeting').textContent = 'Hi, ' + (state.user?.displayName || state.user?.username || '');
  await loadStrains();
}

// ============ STATS ============
function renderStats() {
  const s = state.strains;
  const totalSpent = s.reduce((a, st) => a + (parseFloat(st.price) || 0), 0);
  const rated = s.filter(st => st.rating > 0);
  const avgRating = rated.length ? (rated.reduce((a, st) => a + st.rating, 0) / rated.length).toFixed(1) : '-';
  const stores = [...new Set(s.map(st => st.store).filter(Boolean))];

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="stat-value">${s.length}</div><div class="stat-label">Total Strains</div></div>
    <div class="stat-card"><div class="stat-value">$${totalSpent.toFixed(2)}</div><div class="stat-label">Total Spent</div></div>
    <div class="stat-card"><div class="stat-value">${avgRating}</div><div class="stat-label">Avg Rating</div></div>
    <div class="stat-card"><div class="stat-value">${stores.length}</div><div class="stat-label">Dispensaries</div></div>
  `;
}

// ============ STRAIN LIST ============
function renderStrains() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const sort = document.getElementById('sortSelect').value;

  let filtered = state.strains.filter(s => {
    if (state.filter !== 'all' && s.type !== state.filter) return false;
    if (search) {
      const hay = [s.name, s.store, s.type, s.review, ...(s.terpenes || [])].join(' ').toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  filtered.sort((a, b) => {
    switch (sort) {
      case 'newest': return new Date(b.createdAt) - new Date(a.createdAt);
      case 'oldest': return new Date(a.createdAt) - new Date(b.createdAt);
      case 'name': return (a.name || '').localeCompare(b.name || '');
      case 'rating': return (b.rating || 0) - (a.rating || 0);
      case 'thc': return parseFloat(b.thc || 0) - parseFloat(a.thc || 0);
      case 'price-low': return (a.price || 0) - (b.price || 0);
      case 'price-high': return (b.price || 0) - (a.price || 0);
      default: return 0;
    }
  });

  if (filtered.length === 0) {
    document.getElementById('strainList').innerHTML = `
      <div class="card" style="text-align:center;padding:40px;color:var(--text2)">
        ${state.strains.length === 0 ? 'No strains yet. Add your first one!' : 'No strains match your search.'}
      </div>`;
    return;
  }

  document.getElementById('strainList').innerHTML = filtered.map(s => {
    const thumb = s.photos?.length ? `<img class="strain-thumb" src="${s.photos[0].url}" alt="">` :
      `<div class="strain-thumb-placeholder">&#127807;</div>`;
    const stars = s.rating ? '&#9733;'.repeat(s.rating) + '&#9734;'.repeat(5 - s.rating) : '';
    const typeClass = s.type ? `type-${s.type}` : '';
    const terpHtml = (s.terpenes || []).slice(0, 3).map(t => `<span class="terpene-tag">${esc(t)}</span>`).join('');

    return `
      <div class="card strain-card" onclick="openStrainDetail('${s.id}')">
        ${thumb}
        <div class="strain-info">
          <div class="strain-name">${esc(s.name)}</div>
          <div class="strain-meta">
            ${s.type ? `<span class="strain-type ${typeClass}">${s.type}</span>` : ''}
            ${s.thc ? `<span>THC: ${esc(s.thc)}%</span>` : ''}
            ${s.cbd ? `<span>CBD: ${esc(s.cbd)}%</span>` : ''}
            ${s.store ? `<span>&#128205; ${esc(s.store)}</span>` : ''}
            ${s.price ? `<span>$${parseFloat(s.price).toFixed(2)}</span>` : ''}
            ${s.weight ? `<span>${esc(s.weight)}</span>` : ''}
          </div>
          ${stars ? `<div class="strain-rating">${stars}</div>` : ''}
          ${terpHtml ? `<div class="terpene-tags" style="margin-top:4px">${terpHtml}</div>` : ''}
          ${s.review ? `<div class="review-text">"${esc(s.review.substring(0, 80))}${s.review.length > 80 ? '...' : ''}"</div>` : ''}
        </div>
        <div class="strain-actions">
          <button class="strain-delete" onclick="event.stopPropagation();confirmDelete('${s.id}','${esc(s.name)}')" title="Delete">&#10005;</button>
        </div>
      </div>`;
  }).join('');
}

  document.querySelectorAll('#f_rating span').forEach(s => {

    s.classList.toggle('filled', parseInt(s.dataset.val) <= val);

async function previewLabel(input) {
  if (!input.files?.length) return;
  const file = input.files[0];
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('labelPreview').innerHTML = `<img src="${e.target.result}" style="max-width:200px;border-radius:8px">`;
  };
  reader.readAsDataURL(file);

  // AI label reading
  document.getElementById('labelStatus').innerHTML = '<span class="spinner"></span> AI is reading the label...';
  try {
    const fd = new FormData();
    fd.append('photo', file);
    const result = await api('read-label', { method: 'POST', formData: fd });
    const p = result.parsed || {};

    if (p.strain_name && !document.getElementById('f_name').value) document.getElementById('f_name').value = p.strain_name;
    if (p.thc) document.getElementById('f_thc').value = p.thc.toString().replace('%', '');
    if (p.cbd) document.getElementById('f_cbd').value = p.cbd.toString().replace('%', '');
    if (p.weight) document.getElementById('f_weight').value = p.weight;
    if (p.batch_info) document.getElementById('f_batch').value = p.batch_info;
    if (p.type) document.getElementById('f_type').value = p.type.toLowerCase();
    if (p.terpenes?.length) document.getElementById('f_terpenes').value = p.terpenes.join(', ');

    document.getElementById('labelStatus').innerHTML = '<span style="color:var(--green)">&#10003; Label data extracted</span>';
    toast('Label data extracted');
  } catch (e) {
    document.getElementById('labelStatus').innerHTML = `<span style="color:var(--red)">Failed: ${e.message}</span>`;
  }
}

async function saveNewStrain() {
  const name = document.getElementById('f_name').value.trim();
  if (!name) return toast('Name is required', 'error');

  const terpStr = document.getElementById('f_terpenes').value;
  const terpenes = terpStr ? terpStr.split(',').map(t => t.trim()).filter(Boolean) : [];

  const body = {
    name,
    type: document.getElementById('f_type').value,
    purchaseDate: document.getElementById('f_date').value,
    thc: document.getElementById('f_thc').value.trim(),
    cbd: document.getElementById('f_cbd').value.trim(),
    weight: document.getElementById('f_weight').value.trim(),
    store: document.getElementById('f_store').value.trim(),
    price: parseFloat(document.getElementById('f_price').value) || 0,
    terpenes,
    batchInfo: document.getElementById('f_batch').value.trim(),
    rating: currentStarRating,
    review: document.getElementById('f_review').value.trim(),
  };

  try {
    const strain = await api('strains', { method: 'POST', body });

    // Upload label photo if present
    const labelInput = document.getElementById('f_label_upload');
    if (labelInput.files?.length) {

    const result = await api('fetch-reviews', { method: 'POST', body: { strainName, forceRefresh } });

    const fromCache = result.source === 'cache';
    const cacheInfo = fromCache
      ? `<div style="font-size:11px;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:8px">

async function parseReceipt(mode) {
  const statusEl = document.getElementById('receiptStatus');
  const resultsEl = document.getElementById('receiptResults');
  statusEl.innerHTML = '<span class="spinner"></span> AI is parsing the receipt...';
  resultsEl.innerHTML = '';

  try {
    let result;
    if (mode === 'photo') {
      const fileInput = document.getElementById('receiptPhotoInput');
      if (!fileInput.files?.length) return toast('Select a photo first', 'error');
      const fd = new FormData();
      fd.append('photo', fileInput.files[0]);
      result = await api('parse-receipt', { method: 'POST', formData: fd });
    } else {
      const text = document.getElementById('receiptText').value.trim();
      if (!text) return toast('Paste receipt text first', 'error');
      result = await api('parse-receipt', { method: 'POST', body: { text } });
    }

    const p = result.parsed || {};
    const items = p.items || [];
    if (!items.length) {
      statusEl.innerHTML = '<span style="color:var(--orange)">No items found in receipt</span>';
      return;
    }

    statusEl.innerHTML = `<span style="color:var(--green)">Found ${items.length} item(s)${p.store ? ' from ' + esc(p.store) : ''}</span>`;
    resultsEl.innerHTML = items.map((item, i) => `
      <div class="card" style="padding:10px;margin-bottom:6px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <strong>${esc(item.name || 'Unknown')}</strong>
            <div style="font-size:12px;color:var(--text2)">
              ${item.price ? '$' + item.price : ''} ${item.weight || ''} ${item.thc ? 'THC:' + item.thc : ''}
            </div>
          </div>
          <button class="btn btn-green btn-sm" onclick="importReceiptItem(${i},'${esc(p.store||'')}')">Add</button>
        </div>
      </div>
    `).join('');

    // Store parsed items for import
    window._receiptItems = items;
    window._receiptStore = p.store || '';

    if (items.length > 1) {
      resultsEl.innerHTML += `<button class="btn btn-green" style="margin-top:8px;width:100%;justify-content:center" onclick="importAllReceiptItems()">Add All ${items.length} Items</button>`;
    }
  } catch (e) {
    statusEl.innerHTML = `<span style="color:var(--red)">Error: ${e.message}</span>`;
  }
}

function importReceiptItem(index, store) {
  const item = window._receiptItems?.[index];
  if (!item) return;
  closeModal();
  openAddStrain({
    name: item.name || '',
    store: store,
    price: item.price || '',
    weight: item.weight || '',
    thc: (item.thc || '').toString().replace('%', ''),
    cbd: (item.cbd || '').toString().replace('%', ''),
    type: (item.type || 'hybrid').toLowerCase(),
  });
}

async function importAllReceiptItems() {
  const items = window._receiptItems || [];
  const store = window._receiptStore || '';
  const statusEl = document.getElementById('receiptStatus');
  statusEl.innerHTML = '<span class="spinner"></span> Adding all items...';

  let added = 0;
  for (const item of items) {
    try {
      await api('strains', { method: 'POST', body: {
        name: item.name || 'Unknown',
        store,
        price: parseFloat(item.price) || 0,
        weight: item.weight || '',
        thc: (item.thc || '').toString().replace('%', ''),
        cbd: (item.cbd || '').toString().replace('%', ''),
        type: (item.type || 'hybrid').toLowerCase(),
        purchaseDate: new Date().toISOString().split('T')[0],
        terpenes: [],
        review: '',
        rating: 0,
      }});
      added++;
    } catch (e) {}
  }

  closeModal();
  await loadStrains();
  toast(`Added ${added} strain(s)`);
}

        <div class="chart-card"><h3>Strain Types</h3><canvas id="udTypes"></canvas></div>
        <div class="chart-card"><h3>Rating Distribution</h3><canvas id="udRatings"></canvas></div>
        <div class="chart-card"><h3>Dispensary Visits</h3><canvas id="udStores"></canvas></div>
        <div class="chart-card"><h3>Dispensary Spending</h3><canvas id="udStoreSpend"></canvas></div>
        <div class="chart-card"><h3>Purchase Day of Week</h3><canvas id="udWeekday"></canvas></div>
        <div class="chart-card"><h3>Top Terpenes</h3><canvas id="udTerpenes"></canvas></div>
        <div class="chart-card"><h3>Top Effects</h3><canvas id="udEffects"></canvas></div>
      </div>

      <h3 style="margin-bottom:12px;font-size:16px">All Strains (${data.strains.length})</h3>
      <div id="udStrainList"></div>
    `;

    // Monthly spending
    const mLabels = Object.keys(a.monthlySpending);
    const mVals = Object.values(a.monthlySpending);
    if (mLabels.length) {
      userDetailCharts.push(createChart(document.getElementById('udMonthly'), {
        type: 'bar',
        data: { labels: mLabels, datasets: [{ label: 'Spent ($)', data: mVals, backgroundColor: chartColors.green, borderRadius: 4 }] },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#999' }, grid: { color: '#333' } }, y: { ticks: { color: '#999', callback: v => '$' + v }, grid: { color: '#333' } } } }
      }));
    }

    // Types pie
    const t = a.strainsByType;
    userDetailCharts.push(createChart(document.getElementById('udTypes'), {
      type: 'pie',
      data: { labels: ['Indica', 'Sativa', 'Hybrid'], datasets: [{ data: [t.indica, t.sativa, t.hybrid], backgroundColor: ['#7b1fa2', '#f57c00', '#388e3c'], borderWidth: 0 }] },
      options: { responsive: true, plugins: { legend: { labels: { color: '#e0e0e0' } } } }
    }));

    // Rating distribution
    const rLabels = ['1 Star', '2 Stars', '3 Stars', '4 Stars', '5 Stars'];
    const rVals = Object.values(a.ratingDistribution);
    userDetailCharts.push(createChart(document.getElementById('udRatings'), {
      type: 'bar',
      data: { labels: rLabels, datasets: [{ label: 'Count', data: rVals, backgroundColor: [chartColors.red, chartColors.orange, chartColors.amber, chartColors.lime, chartColors.green], borderRadius: 4 }] },
      options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#999' }, grid: { color: '#333' } }, y: { ticks: { color: '#999', stepSize: 1 }, grid: { color: '#333' } } } }
    }));

    // Store visits - doughnut
    const svLabels = Object.keys(a.storeVisits);
    const svVals = Object.values(a.storeVisits);
    if (svLabels.length) {
      const storeColors = svLabels.map((_, i) => [chartColors.blue, chartColors.green, chartColors.orange, chartColors.purple, chartColors.red, chartColors.teal, chartColors.pink, chartColors.amber, chartColors.indigo, chartColors.lime][i % 10]);
      userDetailCharts.push(createChart(document.getElementById('udStores'), {
        type: 'doughnut',
        data: { labels: svLabels, datasets: [{ data: svVals, backgroundColor: storeColors, borderWidth: 0 }] },
        options: { responsive: true, plugins: { legend: { labels: { color: '#e0e0e0' }, position: 'bottom' } } }
      }));
    }

    // Store spending - horizontal bar
    const ssLabels = Object.keys(a.storeSpending);
    const ssVals = Object.values(a.storeSpending);
    if (ssLabels.length) {
      userDetailCharts.push(createChart(document.getElementById('udStoreSpend'), {
        type: 'bar',
        data: { labels: ssLabels, datasets: [{ label: 'Spent ($)', data: ssVals, backgroundColor: chartColors.blue, borderRadius: 4 }] },
        options: { responsive: true, indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#999', callback: v => '$' + v }, grid: { color: '#333' } }, y: { ticks: { color: '#999' }, grid: { color: '#333' } } } }
      }));
    }

    // Weekday distribution - radar
    const dayLabels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    userDetailCharts.push(createChart(document.getElementById('udWeekday'), {
      type: 'radar',
      data: { labels: dayLabels, datasets: [{ label: 'Purchases', data: a.weekdayDistribution, borderColor: chartColors.green, backgroundColor: chartColors.greenAlpha, pointBackgroundColor: chartColors.green }] },
      options: { responsive: true, plugins: { legend: { display: false } }, scales: { r: { ticks: { color: '#999', stepSize: 1, backdropColor: 'transparent' }, grid: { color: '#444' }, angleLines: { color: '#444' }, pointLabels: { color: '#e0e0e0' } } } }
    }));

    // Top terpenes - polar area
    const tpLabels = Object.keys(a.topTerpenes);
    const tpVals = Object.values(a.topTerpenes);
    if (tpLabels.length) {
      const terpColors = tpLabels.map((_, i) => [chartColors.green, chartColors.teal, chartColors.lime, chartColors.blue, chartColors.purple, chartColors.orange, chartColors.pink, chartColors.amber, chartColors.indigo, chartColors.red][i % 10]);
      userDetailCharts.push(createChart(document.getElementById('udTerpenes'), {
        type: 'polarArea',
        data: { labels: tpLabels, datasets: [{ data: tpVals, backgroundColor: terpColors.map(c => c + '99'), borderWidth: 0 }] },
        options: { responsive: true, plugins: { legend: { labels: { color: '#e0e0e0' }, position: 'bottom' } }, scales: { r: { ticks: { color: '#999', backdropColor: 'transparent' }, grid: { color: '#444' } } } }
      }));
    }

    // Top effects - horizontal bar
    const efLabels = Object.keys(a.topEffects);
    const efVals = Object.values(a.topEffects);
    if (efLabels.length) {
      userDetailCharts.push(createChart(document.getElementById('udEffects'), {
        type: 'bar',
        data: { labels: efLabels, datasets: [{ label: 'Count', data: efVals, backgroundColor: chartColors.purple, borderRadius: 4 }] },
        options: { responsive: true, indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#999', stepSize: 1 }, grid: { color: '#333' } }, y: { ticks: { color: '#999' }, grid: { color: '#333' } } } }
      }));
    }

    // Strain list
    const strainListEl = document.getElementById('udStrainList');
    if (data.strains.length) {
      strainListEl.innerHTML = data.strains.map(s => {
        const typeClass = s.type ? `type-${s.type}` : '';
        const stars = s.rating ? '&#9733;'.repeat(s.rating) + '&#9734;'.repeat(5 - s.rating) : '';
        return `
          <div class="strain-mini-card">
            <div>
              <div class="strain-mini-name">
                ${esc(s.name)}
                ${s.type ? `<span class="strain-type ${typeClass}" style="font-size:10px;margin-left:6px">${s.type}</span>` : ''}
              </div>
              <div class="strain-mini-meta">
                ${s.store ? `<span>${esc(s.store)}</span>` : ''}
                ${s.price ? `<span>$${parseFloat(s.price).toFixed(2)}</span>` : ''}
                ${s.thc ? `<span>THC: ${esc(s.thc)}%</span>` : ''}
                ${s.weight ? `<span>${esc(s.weight)}</span>` : ''}
                ${s.purchaseDate ? `<span>${s.purchaseDate}</span>` : ''}
              </div>
            </div>
            <div style="text-align:right">
              ${stars ? `<div class="strain-rating" style="font-size:12px">${stars}</div>` : ''}
            </div>
          </div>`;
      }).join('');
    } else {
      strainListEl.innerHTML = '<div style="color:var(--text2);font-size:13px;padding:16px">No strains yet.</div>';
    }
  } catch (e) {
    el.innerHTML = `<div style="color:var(--red);padding:20px">${e.message}</div>`;
  }
}

// ============ INIT ============
window.onerror = function(msg, src, line, col, err) {
  console.error('[ST Error]', msg, 'at line', line);
};
console.log('[ST] Init - token:', !!state.token, 'user:', state.user?.id, 'isAdmin:', state.user?.isAdmin);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeLightbox(); }
});

if (state.token && state.user) {
  showApp();
} else {
  showAuth();
}
</script>
</body>
</html>
