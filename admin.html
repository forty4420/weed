<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strain Tracker - Admin</title>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --card: #1a1a1a;
  --border: #2a2a2a;
  --text: #e0e0e0;
  --text2: #888;
  --green: #4caf50;
  --green-dark: #388e3c;
  --red: #f44336;
  --orange: #ff9800;
  --blue: #2196f3;
  --purple: #9c27b0;
  --teal: #009688;
  --pink: #e91e63;
  --amber: #ffc107;
  --indigo: #3f51b5;
  --lime: #cddc39;
  --accent: #f44336;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
a { color:var(--green); text-decoration:none; }
button { cursor:pointer; border:none; font-family:inherit; font-size:14px; }
input,select { font-family:inherit; font-size:14px; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px 14px; width:100%; outline:none; transition:border-color .2s; }
input:focus { border-color:var(--accent); }
.hidden { display:none !important; }

/* Login */
.login-container { max-width:400px; margin:0 auto; padding:16px; min-height:100vh; display:flex; align-items:center; justify-content:center; }
.login-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:40px 30px; width:100%; }
.login-title { text-align:center; font-size:24px; color:var(--accent); margin-bottom:4px; font-weight:700; }
.login-subtitle { text-align:center; color:var(--text2); margin-bottom:28px; font-size:13px; }
.login-error { background:rgba(244,67,54,.1); border:1px solid rgba(244,67,54,.3); color:var(--red); padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; display:none; }
.login-btn { width:100%; padding:12px; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; font-size:15px; margin-top:12px; transition:background .2s; }
.login-btn:hover { background:#d32f2f; }

/* Layout */
.app { display:flex; min-height:100vh; }
.sidebar { width:240px; background:var(--surface); border-right:1px solid var(--border); padding:20px 0; flex-shrink:0; position:fixed; top:0; left:0; bottom:0; overflow-y:auto; z-index:50; }
.sidebar-brand { padding:0 20px 20px; border-bottom:1px solid var(--border); margin-bottom:12px; }
.sidebar-brand h1 { font-size:18px; color:var(--accent); }
.sidebar-brand p { font-size:11px; color:var(--text2); margin-top:2px; }
.sidebar-nav { list-style:none; }
.sidebar-nav li { padding:0; }
.sidebar-nav a { display:flex; align-items:center; gap:10px; padding:10px 20px; color:var(--text2); font-size:13px; transition:all .15s; cursor:pointer; text-decoration:none; }
.sidebar-nav a:hover { background:rgba(255,255,255,.04); color:var(--text); }
.sidebar-nav a.active { color:var(--accent); background:rgba(244,67,54,.08); border-right:3px solid var(--accent); }
.sidebar-nav a .nav-icon { width:20px; text-align:center; font-size:16px; }
.sidebar-footer { position:absolute; bottom:0; left:0; right:0; padding:16px 20px; border-top:1px solid var(--border); }
.sidebar-footer button { background:none; color:var(--text2); font-size:12px; padding:6px 0; width:100%; text-align:left; }
.sidebar-footer button:hover { color:var(--red); }

.main { margin-left:240px; flex:1; padding:24px 32px; min-width:0; }
.page-title { font-size:22px; font-weight:700; margin-bottom:20px; display:flex; align-items:center; gap:12px; }
.page-title .badge { font-size:12px; padding:3px 10px; border-radius:12px; background:rgba(244,67,54,.15); color:var(--accent); }

/* Stat Cards */
.stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:24px; }
.stat-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; }
.stat-card .value { font-size:28px; font-weight:700; color:var(--green); }
.stat-card .label { font-size:12px; color:var(--text2); margin-top:4px; }
.stat-card.accent .value { color:var(--accent); }
.stat-card.blue .value { color:var(--blue); }
.stat-card.orange .value { color:var(--orange); }
.stat-card.purple .value { color:var(--purple); }

/* Charts */
.chart-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin-bottom:24px; }
.chart-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; }
.chart-card h3 { font-size:13px; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; margin-bottom:14px; }
.chart-card canvas { max-height:280px; }
.chart-card.full { grid-column:1/-1; }
.chart-card.full canvas { max-height:320px; }

/* Table */
.table-wrapper { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:24px; }
.table-header { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:10px; }
.table-header input { max-width:280px; }
.table-header .count { font-size:12px; color:var(--text2); }
table { width:100%; border-collapse:collapse; }
table th { text-align:left; padding:10px 14px; font-size:11px; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; border-bottom:1px solid var(--border); font-weight:600; }
table td { padding:10px 14px; font-size:13px; border-bottom:1px solid var(--border); }
table tr:last-child td { border-bottom:none; }
table tr:hover td { background:rgba(255,255,255,.02); }
.user-cell { display:flex; align-items:center; gap:10px; }
.user-avatar { width:32px; height:32px; border-radius:50%; background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; color:var(--green); flex-shrink:0; }
.user-name { font-weight:500; }
.user-handle { font-size:11px; color:var(--text2); }
.badge-admin { font-size:10px; padding:1px 6px; border-radius:6px; background:rgba(244,67,54,.15); color:var(--accent); font-weight:600; margin-left:4px; }
.badge-blocked { font-size:10px; padding:1px 6px; border-radius:6px; background:rgba(255,152,0,.15); color:var(--orange); font-weight:600; margin-left:4px; }

/* Buttons */
.btn { padding:6px 14px; border-radius:6px; font-weight:500; font-size:12px; transition:all .15s; display:inline-flex; align-items:center; gap:5px; }
.btn-red { background:var(--red); color:#fff; }
.btn-red:hover { background:#d32f2f; }
.btn-green { background:var(--green); color:#fff; }
.btn-green:hover { background:var(--green-dark); }
.btn-blue { background:var(--blue); color:#fff; }
.btn-blue:hover { background:#1976d2; }
.btn-orange { background:var(--orange); color:#fff; }
.btn-orange:hover { background:#f57c00; }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
.btn-outline:hover { border-color:var(--accent); color:var(--accent); }
.btn-ghost { background:none; color:var(--text2); padding:4px 8px; }
.btn-ghost:hover { color:var(--text); }
.actions { display:flex; gap:6px; }

/* User Detail */
.back-link { display:inline-flex; align-items:center; gap:6px; color:var(--text2); font-size:13px; margin-bottom:16px; cursor:pointer; }
.back-link:hover { color:var(--accent); }
.detail-header { display:flex; align-items:center; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
.detail-avatar { width:64px; height:64px; border-radius:50%; background:var(--card); border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; color:var(--green); }
.detail-info h2 { font-size:20px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.detail-info p { font-size:13px; color:var(--text2); }
.detail-actions { margin-left:auto; display:flex; gap:8px; }

/* Top 10 List */
.top-list { list-style:none; }
.top-list li { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
.top-list li:last-child { border-bottom:none; }
.top-list .rank { width:24px; font-size:12px; color:var(--text2); font-weight:600; }
.top-list .name { flex:1; }
.top-list .count { color:var(--green); font-weight:600; }

/* Strain mini cards */
.strain-mini { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 14px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; }
.strain-mini-name { font-size:13px; font-weight:500; }
.strain-mini-meta { font-size:11px; color:var(--text2); display:flex; gap:8px; margin-top:2px; }
.strain-type { font-size:10px; padding:2px 8px; border-radius:10px; font-weight:500; text-transform:uppercase; }
.type-indica { background:#7b1fa2; color:#fff; }
.type-sativa { background:#f57c00; color:#fff; }
.type-hybrid { background:#388e3c; color:#fff; }
.strain-rating { color:var(--orange); font-size:12px; }

/* Modal */
.modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.75); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px; }
.modal { background:var(--surface); border:1px solid var(--border); border-radius:16px; width:100%; max-width:440px; }
.modal-header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); }
.modal-header h3 { font-size:16px; }
.modal-body { padding:20px; }
.modal-body p { font-size:13px; line-height:1.5; }
.modal-footer { padding:12px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; }

/* Toast */
.toast { position:fixed; bottom:24px; right:24px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 18px; z-index:300; font-size:14px; animation:slideUp .3s; max-width:360px; }
.toast.success { border-color:var(--green); }
.toast.error { border-color:var(--red); }
@keyframes slideUp { from { transform:translateY(20px); opacity:0; } to { transform:translateY(0); opacity:1; } }

/* Spinner */
.spinner { width:20px; height:20px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .6s linear infinite; display:inline-block; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Mobile sidebar */
.mobile-toggle { display:none; position:fixed; top:12px; left:12px; z-index:60; background:var(--card); border:1px solid var(--border); color:var(--text); padding:8px 12px; border-radius:8px; font-size:18px; }

/* Time period tabs */
.period-tabs { display:flex; gap:4px; margin-bottom:16px; }
.period-tab { padding:5px 12px; border-radius:6px; font-size:12px; background:transparent; color:var(--text2); border:1px solid var(--border); cursor:pointer; transition:all .15s; }
.period-tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }

@media (max-width:768px) {
  .sidebar { transform:translateX(-100%); transition:transform .25s; z-index:100; }
  .sidebar.open { transform:translateX(0); }
  .main { margin-left:0; padding:16px; padding-top:56px; }
  .chart-grid { grid-template-columns:1fr; }
  .stats-row { grid-template-columns:repeat(2,1fr); }
  .mobile-toggle { display:block; }
  table { font-size:11px; }
  table th, table td { padding:6px 8px; }
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-container">
    <div class="login-card">
      <div class="login-title">Admin Panel</div>
      <div class="login-subtitle">Strain Tracker Administration</div>
      <div class="login-error" id="loginError"></div>
      <form onsubmit="doLogin(event)">
        <input type="password" id="loginPassword" placeholder="Enter admin password" autofocus>
        <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
      </form>
    </div>
  </div>
</div>

<!-- ADMIN APP -->
<div id="adminApp" class="hidden">
  <button class="mobile-toggle" onclick="toggleSidebar()">&#9776;</button>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h1>Admin Panel</h1>
      <p>Strain Tracker</p>
    </div>
    <ul class="sidebar-nav">
      <li><a class="active" onclick="showPage('overview')" data-page="overview"><span class="nav-icon">&#9632;</span> Overview</a></li>
      <li><a onclick="showPage('spending')" data-page="spending"><span class="nav-icon">&#36;</span> Spending</a></li>
      <li><a onclick="showPage('strains')" data-page="strains"><span class="nav-icon">&#9752;</span> Top Strains</a></li>
      <li><a onclick="showPage('users')" data-page="users"><span class="nav-icon">&#9786;</span> Users</a></li>
      <li><a onclick="showPage('userDetail')" data-page="userDetail" id="navUserDetail" style="display:none"><span class="nav-icon">&#9998;</span> User Detail</a></li>
    </ul>
    <div class="sidebar-footer">
      <button onclick="downloadCSV()">Export All Data (CSV)</button>
      <button onclick="doLogout()" style="margin-top:6px;color:var(--red)">Sign Out</button>
    </div>
  </nav>

  <div class="main">
    <!-- OVERVIEW PAGE -->
    <div id="page-overview">
      <div class="page-title">Overview</div>
      <div class="stats-row" id="overviewStats"></div>
      <div class="chart-grid" id="overviewCharts"></div>
    </div>

    <!-- SPENDING PAGE -->
    <div id="page-spending" class="hidden">
      <div class="page-title">Spending Analytics</div>
      <div class="stats-row" id="spendingStats"></div>
      <div class="period-tabs" id="spendingPeriodTabs">
        <button class="period-tab" onclick="setSpendingPeriod('weekly',this)">Weekly</button>
        <button class="period-tab active" onclick="setSpendingPeriod('monthly',this)">Monthly</button>
        <button class="period-tab" onclick="setSpendingPeriod('yearly',this)">Yearly</button>
      </div>
      <div class="chart-grid" id="spendingCharts"></div>
    </div>

    <!-- TOP STRAINS PAGE -->
    <div id="page-strains" class="hidden">
      <div class="page-title">Top Strains <span class="badge">Top 10</span></div>
      <div class="chart-grid" id="strainsCharts"></div>
    </div>

    <!-- USERS PAGE -->
    <div id="page-users" class="hidden">
      <div class="page-title">User Management</div>
      <div class="table-wrapper">
        <div class="table-header">
          <input type="text" id="userSearchInput" placeholder="Search users..." oninput="filterUsers()">
          <div style="display:flex;gap:10px;align-items:center">
            <span class="count" id="userCount"></span>
            <button class="btn btn-green" onclick="downloadCSV()">Export CSV</button>
          </div>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>User</th>
                <th>Email</th>
                <th>Strains</th>
                <th>Spent</th>
                <th>Stores</th>
                <th>Visits</th>
                <th>Joined</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="userTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- USER DETAIL PAGE -->
    <div id="page-userDetail" class="hidden">
      <div id="userDetailContent"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="modalOverlay" class="modal-overlay hidden" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header"><h3 id="modalTitle"></h3><button class="btn-ghost" onclick="closeModal()">&times;</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script>
// ============ CONFIG ============
const API_URL = 'api.php';
let adminToken = sessionStorage.getItem('adminToken') || '';
let statsCache = null;
let usersCache = [];
let charts = [];
const esc = s => s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '';

const COLORS = {
  green:'#4caf50', red:'#f44336', orange:'#ff9800', blue:'#2196f3',
  purple:'#9c27b0', teal:'#009688', pink:'#e91e63', amber:'#ffc107',
  indigo:'#3f51b5', lime:'#cddc39', cyan:'#00bcd4', brown:'#795548',
  greenA:'rgba(76,175,80,.3)', blueA:'rgba(33,150,243,.3)',
  redA:'rgba(244,67,54,.3)', orangeA:'rgba(255,152,0,.3)',
  purpleA:'rgba(156,39,176,.3)', tealA:'rgba(0,150,136,.3)',
};
const PALETTE = [COLORS.green,COLORS.blue,COLORS.orange,COLORS.purple,COLORS.red,COLORS.teal,COLORS.pink,COLORS.amber,COLORS.indigo,COLORS.lime,COLORS.cyan,COLORS.brown];

// ============ AUTH ============
async function doLogin(e) {
  e.preventDefault();
  const pw = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  if (!pw) { errEl.textContent = 'Enter the admin password'; errEl.style.display = ''; return; }
  btn.textContent = 'Signing in...'; btn.disabled = true;
  try {
    const r = await fetch(`${API_URL}?action=admin-login`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pw})
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Login failed');
    adminToken = data.token;
    sessionStorage.setItem('adminToken', adminToken);
    errEl.style.display = 'none';
    showAdminApp();
  } catch(err) {
    errEl.textContent = err.message; errEl.style.display = '';
  } finally { btn.textContent = 'Sign In'; btn.disabled = false; }
}

function doLogout() {
  adminToken = '';
  sessionStorage.removeItem('adminToken');
  statsCache = null;
  usersCache = [];
  document.getElementById('adminApp').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginPassword').value = '';
}

async function api(action, opts = {}) {
  const url = `${API_URL}?action=${action}`;
  const fetchOpts = { headers: { 'Authorization': 'Bearer ' + adminToken } };
  if (opts.method) fetchOpts.method = opts.method;
  if (opts.body) {
    fetchOpts.method = fetchOpts.method || 'POST';
    fetchOpts.headers['Content-Type'] = 'application/json';
    fetchOpts.body = JSON.stringify(opts.body);
  }
  const r = await fetch(url, fetchOpts);
  if (r.status === 401 || r.status === 403) { doLogout(); throw new Error('Session expired'); }
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || 'Request failed');
  return data;
}

// ============ NAV ============
function showAdminApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('adminApp').classList.remove('hidden');
  showPage('overview');
}

function showPage(page) {
  ['overview','spending','strains','users','userDetail'].forEach(p => {
    document.getElementById('page-'+p).classList.toggle('hidden', p !== page);
  });
  document.querySelectorAll('.sidebar-nav a').forEach(a => {
    a.classList.toggle('active', a.dataset.page === page);
  });
  if (page !== 'userDetail') document.getElementById('navUserDetail').style.display = 'none';
  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');
  // Load data
  if (page === 'overview') loadOverview();
  else if (page === 'spending') loadSpending();
  else if (page === 'strains') loadStrains();
  else if (page === 'users') loadUsers();
}

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

// ============ TOAST ============
function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ============ MODAL ============
function showModal(title, bodyHtml, buttons) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFooter').innerHTML = buttons.map(b =>
    `<button class="${b.class}" onclick="${b.onclick}">${b.text}</button>`
  ).join('');
  document.getElementById('modalOverlay').classList.remove('hidden');
}
function closeModal() { document.getElementById('modalOverlay').classList.add('hidden'); }

// ============ CHARTS HELPER ============
function destroyCharts() { charts.forEach(c => c && c.destroy()); charts = []; }

function makeChart(canvasId, config) {
  if (typeof Chart === 'undefined') return null;
  const el = document.getElementById(canvasId);
  if (!el) return null;
  const c = new Chart(el, config);
  charts.push(c);
  return c;
}

const darkScales = {
  x: { ticks:{color:'#888'}, grid:{color:'#222'} },
  y: { ticks:{color:'#888'}, grid:{color:'#222'} }
};
const darkLegend = { labels:{color:'#ccc'} };
const dollarY = { ticks:{color:'#888',callback:v=>'$'+v.toLocaleString()}, grid:{color:'#222'} };

// ============ FETCH STATS ============
async function fetchStats(force) {
  if (statsCache && !force) return statsCache;
  statsCache = await api('admin-stats');
  return statsCache;
}
async function fetchUsers(force) {
  if (usersCache.length && !force) return usersCache;
  usersCache = await api('admin-users');
  return usersCache;
}

// ============ OVERVIEW PAGE ============
async function loadOverview() {
  try {
    const stats = await fetchStats();
    document.getElementById('overviewStats').innerHTML = `
      <div class="stat-card"><div class="value">${stats.totalUsers}</div><div class="label">Total Users</div></div>
      <div class="stat-card blue"><div class="value">${stats.totalStrains}</div><div class="label">Total Strains</div></div>
      <div class="stat-card"><div class="value">$${stats.totalSpent.toLocaleString(undefined,{minimumFractionDigits:2})}</div><div class="label">Total Spent</div></div>
      <div class="stat-card orange"><div class="value">${stats.avgStrainsPerUser}</div><div class="label">Avg Strains/User</div></div>
      <div class="stat-card purple"><div class="value">${stats.avgRating || '-'}</div><div class="label">Avg Rating</div></div>
      <div class="stat-card"><div class="value">${stats.storeCount}</div><div class="label">Dispensaries</div></div>
      <div class="stat-card accent"><div class="value">${stats.blockedUsers}</div><div class="label">Blocked Users</div></div>
    `;

    destroyCharts();
    document.getElementById('overviewCharts').innerHTML = `

// ============ SPENDING PAGE ============
let currentPeriod = 'monthly';

function setSpendingPeriod(period, btn) {
  currentPeriod = period;
  document.querySelectorAll('#spendingPeriodTabs .period-tab').forEach(t => t.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderSpendingCharts();
}

async function loadSpending() {
  try {
    const stats = await fetchStats();
    const avgPerStrain = stats.totalStrains > 0 ? (stats.totalSpent / stats.totalStrains).toFixed(2) : '0.00';
    document.getElementById('spendingStats').innerHTML = `
      <div class="stat-card"><div class="value">$${stats.totalSpent.toLocaleString(undefined,{minimumFractionDigits:2})}</div><div class="label">Total All-Time</div></div>
      <div class="stat-card blue"><div class="value">$${avgPerStrain}</div><div class="label">Avg Per Purchase</div></div>
      <div class="stat-card orange"><div class="value">${Object.keys(stats.yearlySpending).length}</div><div class="label">Years Active</div></div>
      <div class="stat-card purple"><div class="value">${Object.keys(stats.monthlySpending).length}</div><div class="label">Months with Purchases</div></div>
    `;
    renderSpendingCharts();
  } catch(e) { toast(e.message,'error'); }
}

function renderSpendingCharts() {
  if (!statsCache) return;
  const stats = statsCache;
  destroyCharts();

  let timeLabels, timeValues, title;
  if (currentPeriod === 'yearly') {
    timeLabels = Object.keys(stats.yearlySpending);
    timeValues = Object.values(stats.yearlySpending);
    title = 'Yearly Spending';
  } else if (currentPeriod === 'weekly') {
    timeLabels = Object.keys(stats.weeklySpending);
    timeValues = Object.values(stats.weeklySpending);
    title = 'Weekly Spending (Last 26 Weeks)';
  } else {
    timeLabels = Object.keys(stats.monthlySpending);
    timeValues = Object.values(stats.monthlySpending);
    title = 'Monthly Spending';
  }

  document.getElementById('spendingCharts').innerHTML = `
    <div class="chart-card full"><h3>${title}</h3><canvas id="cSpendTime"></canvas></div>
    <div class="chart-card"><h3>Spending by User (Top 10)</h3><canvas id="cSpendUser"></canvas></div>
    <div class="chart-card"><h3>Spending by Dispensary</h3><canvas id="cSpendStore"></canvas></div>
  `;

  if (timeLabels.length) makeChart('cSpendTime', {
    type:'bar', data:{labels:timeLabels, datasets:[{label:'Spent ($)',data:timeValues,backgroundColor:COLORS.green,borderRadius:4},{label:'Trend',data:timeValues,type:'line',borderColor:COLORS.orange,backgroundColor:'transparent',tension:.3,pointRadius:2,borderWidth:2}]},
    options:{responsive:true, plugins:{legend:darkLegend}, scales:{x:darkScales.x, y:dollarY}}
  });

  // Spending by user
  const uL = Object.keys(stats.spendingByUser), uV = Object.values(stats.spendingByUser);
  if (uL.length) makeChart('cSpendUser', {
    type:'bar', data:{labels:uL, datasets:[{label:'Spent ($)',data:uV,backgroundColor:uL.map((_,i)=>PALETTE[i%PALETTE.length]),borderRadius:4}]},
    options:{responsive:true, indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:dollarY, y:{ticks:{color:'#888'},grid:{color:'#222'}}}}
  });

  // Spending by store (reuse topStores count, but let's show it differently)
  const sN = Object.keys(stats.topStores), sV = Object.values(stats.topStores);
  if (sN.length) makeChart('cSpendStore', {
    type:'doughnut', data:{labels:sN, datasets:[{data:sV,backgroundColor:sN.map((_,i)=>PALETTE[i%PALETTE.length]),borderWidth:0}]},
    options:{responsive:true, plugins:{legend:{...darkLegend,position:'bottom'}}}
  });
}

  document.getElementById('userCount').textContent = `${filtered.length} user(s)`;

    const initial = (u.displayName || u.username || '?')[0].toUpperCase();

            <div class="user-name">${esc(u.displayName||u.username)}${u.isAdmin?'<span class="badge-admin">ADMIN</span>':''}${blocked?'<span class="badge-blocked">BLOCKED</span>':''}</div>

// ============ BLOCK/UNBLOCK ============
function toggleBlock(userId, username, block) {
  const action = block ? 'Block' : 'Unblock';
  const color = block ? 'var(--orange)' : 'var(--green)';
  showModal(`${action} User`, `
    <p>Are you sure you want to <strong style="color:${color}">${action.toLowerCase()}</strong> <strong>${esc(username)}</strong>?</p>
    ${block ? '<p style="color:var(--orange);font-size:12px;margin-top:8px">This user will be immediately logged out and unable to sign in.</p>' : ''}
  `, [
    {text:'Cancel', class:'btn btn-outline', onclick:'closeModal()'},
    {text:action, class:block?'btn btn-orange':'btn btn-green', onclick:`doToggleBlock('${userId}',${block})`}
  ]);
}

async function doToggleBlock(userId, block) {
  try {
    await api('admin-block-user', {method:'POST', body:{userId, block}});
    closeModal();
    toast(block ? 'User blocked' : 'User unblocked');
    await loadUsers();
  } catch(e) { toast(e.message,'error'); }
}

// ============ DELETE ============
function confirmDelete(userId, username) {
  showModal('Delete User', `
    <p>Are you sure you want to permanently delete <strong>${esc(username)}</strong>?</p>
    <p style="color:var(--red);font-size:12px;margin-top:8px">This will delete their account, all strains, photos, and backups. This cannot be undone.</p>
  `, [
    {text:'Cancel', class:'btn btn-outline', onclick:'closeModal()'},
    {text:'Delete Permanently', class:'btn btn-red', onclick:`doDelete('${userId}')`}
  ]);
}

async function doDelete(userId) {
  try {
    await api('admin-delete-user', {method:'POST', body:{userId}});
    closeModal();
    toast('User deleted');
    statsCache = null; // invalidate
    await loadUsers();
  } catch(e) { toast(e.message,'error'); }
}

// ============ EXPORT CSV ============
function downloadCSV() {
  const url = `${API_URL}?action=admin-export-csv`;
  fetch(url, { headers:{'Authorization':'Bearer '+adminToken} })
    .then(r => { if(!r.ok) throw new Error('Export failed'); return r.blob(); })
    .then(blob => {
      const u = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = u;
      a.download = `all_users_export_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(u);
      toast('CSV downloaded');
    })
    .catch(e => toast(e.message,'error'));
}

    .catch(() => doLogout());
} else {
  document.getElementById('loginScreen').classList.remove('hidden');
}
</script>
